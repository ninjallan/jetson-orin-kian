[project]
name = "kian"
version = "0.1.0"
description = "Voice assistant: wake word -> VAD -> Whisper -> LLM -> Piper TTS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "onnxruntime==1.17.0",
    "faster-whisper>=1.1.0",
    "llama-cpp-python>=0.3.19",
    "piper-tts>=1.4",
    "sounddevice>=0.5",
    "numpy>=1.24",
    "jetson-gpio>=2.1.12",
    "pulsectl>=24.12.0",
    "tokenizers>=0.15",
    "openwakeword>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
kian = "kian.app:main"
